name: Build & Verify (MC 26.3)

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Cache Minecraft 26.3 client JAR
        uses: actions/cache@v4
        with:
          path: .gradle/minecraft/26.3
          key: mc-26.3-client-v1-${{ hashFiles('src/main/resources/autism.accesswidener', 'tools/ApplyAccessWidener.java') }}

      - name: Assemble mod JAR & resolve tool environment
        run: ./gradlew assemble prepareToolEnv --no-daemon

      - name: Run MC 26.3 Mixin audits (Sodium, Sodium+Iris, Indigo)
        env:
          SKIP_JAR_CHECK: '1'
        run: bash tools/verify-26.3.sh

      - name: Run regression checks
        run: bash tools/checks/run.sh
