tasks.withType(JavaCompile).configureEach {
    dependsOn tasks.named('applyAccessWidener')
    options.release = 25
    options.encoding = 'UTF-8'
    options.compilerArgs.addAll(['-proc:none', '-nowarn', '-Xmaxerrs', '5000'])
    options.fork = true
    options.forkOptions.memoryMaximumSize = '4g'
}

tasks.register('prepareToolEnv') {
    group = 'verification'
    description = 'Exports resolved Maven/Mojang classpaths and audit mod JAR paths to build/tool-env.sh for tools/verify-26.3.sh and tools/checks/run.sh.'
    dependsOn tasks.named('downloadMinecraftClient'), tasks.named('applyAccessWidener')
    def envFile = layout.buildDirectory.file('tool-env.sh')
    outputs.file(envFile)
    doLast {
        def q = { String s -> "'" + s.replace("'", "'\"'\"'") + "'" }
        def gameFiles = useLocalCp ? (localCpJars + configurations.minecraftRuntimeLibs.files) : ([minecraftClientJar] + configurations.minecraftRuntimeLibs.files)
        def classesDir = layout.buildDirectory.dir('classes/java/main').get().asFile
        def checkCp = ([classesDir] + configurations.compileClasspath.files).collect { it.absolutePath }.join(File.pathSeparator)
        def gameCp = gameFiles.collect { it.absolutePath }.unique().join(File.pathSeparator)

        def out = envFile.get().asFile
        out.parentFile.mkdirs()
        out.text = [
            "ASM_CP=${q(configurations.asmTools.asPath)}",
            "LOADER_CP=${q(configurations.fabricKnotLoader.asPath)}",
            "GAME_CP=${q(gameCp)}",
            "CHECK_CP=${q(checkCp)}",
            "MOD_FABRIC_API=${q(configurations.auditModFabricApi.singleFile.absolutePath)}",
            "MOD_LITHIUM=${q(configurations.auditModLithium.singleFile.absolutePath)}",
            "MOD_MODMENU=${q(configurations.auditModModMenu.singleFile.absolutePath)}",
            "MOD_SODIUM_BETA5=${q(configurations.auditModSodiumBeta5.singleFile.absolutePath)}",
            "MOD_SODIUM_IRIS=${q(configurations.auditModSodiumIris.singleFile.absolutePath)}",
            "MOD_IRIS=${q(configurations.auditModIris.singleFile.absolutePath)}",
        ].join('\n') + '\n'
    }
}

tasks.register('packageModJar', Exec) {
    dependsOn tasks.named('compileJava')
    group = 'build'
    description = 'Reverse-remaps compiled classes back to runtime ABI and packages the runnable Fabric mod JAR.'
    def javaBin = "${System.getProperty('java.home')}/bin/java"
    def classesDir = layout.buildDirectory.dir('classes/java/main').get().asFile
    def outJar = layout.buildDirectory.file("libs/AUTISM-Client-${version}.jar").get().asFile
    inputs.dir(classesDir)
    inputs.dir(file('src/main/resources'))
    inputs.files(
        file('tools/ReverseRemapJar.java'),
        file('mappings/disambig.tsv'),
        file('mappings/enum-names.tsv'),
        file('mappings/record-names.tsv')
    )
    outputs.file(outJar)
    doFirst {
        commandLine(
            javaBin,
            '-cp', configurations.asmTools.asPath,
            file('tools/ReverseRemapJar.java').absolutePath,
            classesDir.absolutePath,
            '-',
            '-',
            file('src/main/resources').absolutePath,
            file('mappings/disambig.tsv').absolutePath,
            outJar.absolutePath
        )
    }
}

tasks.named('jar') { enabled = false }

tasks.named('assemble') {
    dependsOn tasks.named('packageModJar')
}
