import java.security.MessageDigest

plugins {
    id 'java'
}

group = 'autismclient'
version = '5.8-26.3'

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

repositories {
    maven {
        name = 'FabricMC'
        url = 'https://maven.fabricmc.net/'
    }
    maven {
        name = 'MinecraftLibraries'
        url = 'https://libraries.minecraft.net/'
    }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content {
            includeGroup 'maven.modrinth'
        }
    }
    mavenCentral()
}

configurations {
    asmTools
}

def minecraftVersion = '26.3'
def minecraftClientUrl = 'https://piston-data.mojang.com/v1/objects/e877b6a07acd633fb3bb475002175cec036e7b87/client.jar'
def minecraftClientSha1 = 'e877b6a07acd633fb3bb475002175cec036e7b87'
def minecraftClientJar = file(".gradle/minecraft/${minecraftVersion}/client.jar")
def minecraftWidenedJar = file(".gradle/minecraft/${minecraftVersion}/client-aw.jar")
def accessWidenerFile = file('src/main/resources/autism.accesswidener')

def cpFile = file(System.getenv('CP26_3') ?: 'cp26.3.txt')
def useLocalCp = cpFile.exists()
def localCpJars = []
if (useLocalCp) {
    cpFile.text.trim().split(':').each { p ->
        def f = file(p.trim())
        if (f.exists() && f.name.endsWith('.jar') && !f.name.startsWith('AUTISM')) {
            localCpJars << f
        }
    }
}

def sha1Of = { File f ->
    def md = MessageDigest.getInstance('SHA-1')
    f.withInputStream { stream ->
        byte[] buf = new byte[65536]
        int n
        while ((n = stream.read(buf)) > 0) md.update(buf, 0, n)
    }
    md.digest().collect { String.format('%02x', it) }.join('')
}

tasks.register('downloadMinecraftClient') {
    group = 'build setup'
    description = "Downloads and verifies the official Minecraft ${minecraftVersion} client JAR."
    enabled = !useLocalCp
    outputs.file(minecraftClientJar)
    onlyIf {
        !(minecraftClientJar.exists() && sha1Of(minecraftClientJar) == minecraftClientSha1)
    }
    doLast {
        minecraftClientJar.parentFile.mkdirs()
        def tmp = new File(minecraftClientJar.parentFile, 'client.jar.tmp')
        logger.lifecycle("Downloading Minecraft ${minecraftVersion} client JAR from Mojang...")
        new URI(minecraftClientUrl).toURL().withInputStream { input ->
            tmp.withOutputStream { out -> out << input }
        }
        def actual = sha1Of(tmp)
        if (actual != minecraftClientSha1) {
            tmp.delete()
            throw new GradleException("SHA-1 mismatch for Minecraft ${minecraftVersion} client.jar: expected ${minecraftClientSha1}, got ${actual}")
        }
        if (!tmp.renameTo(minecraftClientJar)) {
            minecraftClientJar.bytes = tmp.bytes
            tmp.delete()
        }
    }
}

tasks.register('applyAccessWidener', Exec) {
    group = 'build setup'
    description = "Applies autism.accesswidener to the Minecraft ${minecraftVersion} client JAR."
    dependsOn tasks.named('downloadMinecraftClient')
    enabled = !useLocalCp
    inputs.file(minecraftClientJar)
    inputs.file(accessWidenerFile)
    inputs.file(file('tools/ApplyAccessWidener.java'))
    outputs.file(minecraftWidenedJar)
    doFirst {
        commandLine(
            "${System.getProperty('java.home')}/bin/java",
            '-cp', configurations.asmTools.asPath,
            file('tools/ApplyAccessWidener.java').absolutePath,
            minecraftClientJar.absolutePath,
            accessWidenerFile.absolutePath,
            minecraftWidenedJar.absolutePath
        )
    }
}

dependencies {
    asmTools 'org.ow2.asm:asm:9.10.1'
    asmTools 'org.ow2.asm:asm-tree:9.10.1'
    asmTools 'org.ow2.asm:asm-commons:9.10.1'

    compileOnly 'org.ow2.asm:asm:9.10.1'
    compileOnly 'org.ow2.asm:asm-tree:9.10.1'
    compileOnly 'org.ow2.asm:asm-commons:9.10.1'
    compileOnly 'org.jetbrains:annotations:26.0.2'

    compileOnly 'net.fabricmc:fabric-loader:0.20.1'
    compileOnly 'net.fabricmc:sponge-mixin:0.17.5+mixin.0.8.7'
    compileOnly 'net.fabricmc.fabric-api:fabric-api:0.166.2+26.3'

    compileOnly('maven.modrinth:sodium:mc26.3-0.9.3-beta.5-fabric') { transitive = false }
    compileOnly('maven.modrinth:iris:1.11.7+26.3-fabric') { transitive = false }
    compileOnly('maven.modrinth:lithium:mc26.3-0.26.3-fabric') { transitive = false }
    compileOnly('maven.modrinth:modmenu:21.0.1') { transitive = false }

    // LWJGL 3.4.3 (MC 26.3) + 3.4.1 GLFW/TinyFD for CompatGLFW & file dialogs
    compileOnly 'org.lwjgl:lwjgl:3.4.3'
    compileOnly 'org.lwjgl:lwjgl-sdl:3.4.3'
    compileOnly 'org.lwjgl:lwjgl-opengl:3.4.3'
    compileOnly 'org.lwjgl:lwjgl-stb:3.4.3'
    compileOnly 'org.lwjgl:lwjgl-freetype:3.4.3'
    compileOnly 'org.lwjgl:lwjgl-jemalloc:3.4.3'
    compileOnly 'org.lwjgl:lwjgl-openal:3.4.3'
    compileOnly 'org.lwjgl:lwjgl-vulkan:3.4.3'
    compileOnly 'org.lwjgl:lwjgl-vma:3.4.3'
    compileOnly 'org.lwjgl:lwjgl-shaderc:3.4.3'
    compileOnly 'org.lwjgl:lwjgl-spng:3.4.3'
    compileOnly 'org.lwjgl:lwjgl-spvc:3.4.3'
    compileOnly('org.lwjgl:lwjgl-glfw:3.4.1') { transitive = false }
    compileOnly('org.lwjgl:lwjgl-tinyfd:3.4.1') { transitive = false }

    if (useLocalCp) {
        compileOnly files(localCpJars)
    } else {
        compileOnly files(minecraftWidenedJar)

        // Official Minecraft 26.3 compile libraries (Mojang + Maven Central)
        compileOnly 'com.mojang:authlib:10.0.77'
        compileOnly 'com.mojang:blocklist:1.0.10'
        compileOnly 'com.mojang:brigadier:1.3.11'
        compileOnly 'com.mojang:datafixerupper:10.0.21'
        compileOnly 'com.mojang:jtracy:1.14.38'
        compileOnly 'com.mojang:logging:1.7.12'
        compileOnly 'com.mojang:patchy:2.2.10'
        compileOnly 'com.mojang:text2speech:1.19.12'
        compileOnly 'com.google.code.gson:gson:2.14.0'
        compileOnly 'com.google.guava:guava:33.6.0-jre'
        compileOnly 'com.ibm.icu:icu4j:78.3'
        compileOnly 'commons-codec:commons-codec:1.22.0'
        compileOnly 'commons-io:commons-io:2.20.0'
        compileOnly 'io.netty:netty-buffer:4.2.16.Final'
        compileOnly 'io.netty:netty-codec-base:4.2.16.Final'
        compileOnly 'io.netty:netty-codec-compression:4.2.16.Final'
        compileOnly 'io.netty:netty-codec-http:4.2.16.Final'
        compileOnly 'io.netty:netty-common:4.2.16.Final'
        compileOnly 'io.netty:netty-handler:4.2.16.Final'
        compileOnly 'io.netty:netty-resolver:4.2.16.Final'
        compileOnly 'io.netty:netty-transport:4.2.16.Final'
        compileOnly 'it.unimi.dsi:fastutil:8.5.18'
        compileOnly 'net.java.dev.jna:jna:5.17.0'
        compileOnly 'net.java.dev.jna:jna-platform:5.17.0'
        compileOnly 'net.sf.jopt-simple:jopt-simple:5.0.4'
        compileOnly 'org.apache.commons:commons-compress:1.28.0'
        compileOnly 'org.apache.commons:commons-lang3:3.20.0'
        compileOnly 'org.apache.logging.log4j:log4j-api:2.26.0'
        compileOnly 'org.apache.logging.log4j:log4j-core:2.26.0'
        compileOnly 'org.apache.logging.log4j:log4j-slf4j2-impl:2.26.0'
        compileOnly 'org.joml:joml:1.10.9'
        compileOnly 'org.jspecify:jspecify:1.0.0'
        compileOnly 'org.slf4j:slf4j-api:2.0.17'
        compileOnly 'com.github.oshi:oshi-core:6.9.0'
        compileOnly 'at.yawk.lz4:lz4-java:1.10.1'
    }

    compileOnly files('stubs/compat-stubs.jar')
    compileOnly files('stubs/integrity-stubs.jar')
    compileOnly files('src/main/resources/autism-ai/worker.jar')
    compileOnly fileTree(dir: 'src/main/resources/META-INF/jars', include: ['*.jar'])
    compileOnly fileTree(dir: 'libs', include: ['**/*.jar'])
}

tasks.withType(JavaCompile).configureEach {
    dependsOn tasks.named('applyAccessWidener')
    options.release = 25
    options.encoding = 'UTF-8'
    options.compilerArgs.addAll(['-proc:none', '-nowarn', '-Xmaxerrs', '5000'])
    options.fork = true
    options.forkOptions.memoryMaximumSize = '4g'
}

tasks.register('packageModJar', Exec) {
    dependsOn tasks.named('compileJava')
    group = 'build'
    description = 'Reverse-remaps compiled classes back to runtime ABI, overlays untouched stock classes, and packages the runnable Fabric mod JAR.'
    def javaBin = "${System.getProperty('java.home')}/bin/java"
    def classesDir = layout.buildDirectory.dir('classes/java/main').get().asFile
    def outJar = layout.buildDirectory.file("libs/AUTISM-Client-${version}.jar").get().asFile
    inputs.dir(classesDir)
    inputs.dir(file('src/main/resources'))
    inputs.files(
        file('tools/ReverseRemapJar.java'),
        file('stubs/integrity-stubs.jar'),
        file('precompiled/integrity-classes.jar'),
        file('mappings/disambig.tsv'),
        file('mappings/enum-names.tsv'),
        file('mappings/record-names.tsv')
    )
    outputs.file(outJar)
    doFirst {
        commandLine(
            javaBin,
            '-cp', configurations.asmTools.asPath,
            file('tools/ReverseRemapJar.java').absolutePath,
            classesDir.absolutePath,
            file('stubs/integrity-stubs.jar').absolutePath,
            file('precompiled/integrity-classes.jar').absolutePath,
            file('src/main/resources').absolutePath,
            file('mappings/disambig.tsv').absolutePath,
            outJar.absolutePath
        )
    }
}

tasks.named('jar') { enabled = false }

tasks.named('assemble') {
    dependsOn tasks.named('packageModJar')
}
