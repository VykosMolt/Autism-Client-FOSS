import java.nio.file.Files
import java.nio.file.StandardCopyOption
import java.security.MessageDigest
import java.util.zip.ZipFile

plugins {
    id 'java'
}

group = 'autismclient'
version = '5.8-26.3'

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

repositories {
    maven {
        name = 'FabricMC'
        url = 'https://maven.fabricmc.net/'
    }
    maven {
        name = 'MinecraftLibraries'
        url = 'https://libraries.minecraft.net/'
    }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content {
            includeGroup 'maven.modrinth'
        }
    }
    mavenCentral()
}

configurations {
    asmTools
    minecraftRuntimeLibs
    compileOnly.extendsFrom(minecraftRuntimeLibs)
    fabricLoader
    fabricKnotLoader
    fabricKnotLoader.extendsFrom(fabricLoader)
    auditModFabricApi
    auditModLithium
    auditModModMenu
    auditModSodiumBeta5
    auditModSodiumIris
    auditModIris
}

def minecraftVersion = '26.3'
def fabricLoaderVersion = '0.19.5'
def fabricMixinVersion = '0.17.4+mixin.0.8.7'
def fabricApiVersion = '0.165.0+26.3'
def minecraftClientUrl = 'https://piston-data.mojang.com/v1/objects/e877b6a07acd633fb3bb475002175cec036e7b87/client.jar'
def minecraftClientSha1 = 'e877b6a07acd633fb3bb475002175cec036e7b87'
def minecraftClientJar = file(".gradle/minecraft/${minecraftVersion}/client.jar")
def minecraftWidenedJar = file(".gradle/minecraft/${minecraftVersion}/client-aw.jar")
def accessWidenerFile = file('src/main/resources/autism.accesswidener')
def integrityStubs = file('stubs/integrity-stubs.jar')
def integrityOverlay = file('precompiled/integrity-classes.jar')

def cpFile = file(System.getenv('CP26_3') ?: 'cp26.3.txt')
def useLocalCp = cpFile.exists()
def localCpJars = []
if (useLocalCp) {
    cpFile.text.trim().split(':').each { p ->
        def f = file(p.trim())
        if (f.exists() && f.name.endsWith('.jar') && !f.name.startsWith('AUTISM')) {
            localCpJars << f
        }
    }
}
def localMcJar = useLocalCp ? localCpJars.find { it.name.startsWith('minecraft-') && it.name.endsWith('-client.jar') } : null
def accessWidenerSourceJar = localMcJar ?: minecraftClientJar
def compileLocalCpJars = localMcJar != null ? localCpJars.collect { it == localMcJar ? minecraftWidenedJar : it } : localCpJars

def sha1Of = { File f ->
    def md = MessageDigest.getInstance('SHA-1')
    f.withInputStream { stream ->
        byte[] buf = new byte[65536]
        int n
        while ((n = stream.read(buf)) > 0) md.update(buf, 0, n)
    }
    md.digest().collect { String.format('%02x', it) }.join('')
}

tasks.register('downloadMinecraftClient') {
    group = 'build setup'
    description = "Downloads and verifies the official Minecraft ${minecraftVersion} client JAR."
    enabled = !useLocalCp
    inputs.property('clientSha1', minecraftClientSha1)
    outputs.file(minecraftClientJar)
    onlyIf {
        !(minecraftClientJar.exists() && sha1Of(minecraftClientJar) == minecraftClientSha1)
    }
    doLast {
        if (gradle.startParameter.offline) {
            throw new GradleException("Minecraft ${minecraftVersion} client JAR is missing or invalid. Run once online or supply CP26_3.")
        }
        minecraftClientJar.parentFile.mkdirs()
        def tmp = Files.createTempFile(minecraftClientJar.parentFile.toPath(), 'client-', '.jar')
        try {
            logger.lifecycle("Downloading Minecraft ${minecraftVersion} client JAR from Mojang...")
            def connection = new URI(minecraftClientUrl).toURL().openConnection()
            connection.connectTimeout = 30000
            connection.readTimeout = 30000
            connection.inputStream.withCloseable { input ->
                Files.copy(input, tmp, StandardCopyOption.REPLACE_EXISTING)
            }
            def actual = sha1Of(tmp.toFile())
            if (actual != minecraftClientSha1) {
                throw new GradleException("SHA-1 mismatch for Minecraft ${minecraftVersion} client.jar: expected ${minecraftClientSha1}, got ${actual}")
            }
            Files.move(tmp, minecraftClientJar.toPath(), StandardCopyOption.REPLACE_EXISTING)
        } finally {
            Files.deleteIfExists(tmp)
        }
    }
}

tasks.register('applyAccessWidener', Exec) {
    group = 'build setup'
    description = "Applies autism.accesswidener to the Minecraft ${minecraftVersion} client JAR."
    dependsOn tasks.named('downloadMinecraftClient')
    enabled = !useLocalCp || localMcJar != null
    inputs.file(accessWidenerSourceJar)
    inputs.file(accessWidenerFile)
    inputs.file(file('tools/ApplyAccessWidener.java'))
    inputs.files(configurations.asmTools)
    outputs.file(minecraftWidenedJar)
    doFirst {
        commandLine(
            "${System.getProperty('java.home')}/bin/java",
            '-cp', configurations.asmTools.asPath,
            file('tools/ApplyAccessWidener.java').absolutePath,
            accessWidenerSourceJar.absolutePath,
            accessWidenerFile.absolutePath,
            minecraftWidenedJar.absolutePath
        )
    }
}

def bundledJars = fileTree(dir: 'src/main/resources/META-INF/jars', include: ['*.jar'])
def extractMixinExtras = tasks.register('extractMixinExtras') {
    def loaderJar = providers.provider { configurations.fabricLoader.singleFile }
    def outputJar = layout.buildDirectory.file('compile-deps/mixinextras.jar')
    inputs.file(loaderJar)
    outputs.file(outputJar)
    doLast {
        new ZipFile(loaderJar.get()).withCloseable { loader ->
            def entry = loader.entries().find { it.name.startsWith('META-INF/jars/mixinextras-fabric-') && it.name.endsWith('.jar') }
            if (entry == null) {
                throw new GradleException("MixinExtras JAR not found inside ${loaderJar.get()}")
            }
            def target = outputJar.get().asFile
            target.parentFile.mkdirs()
            loader.getInputStream(entry).withCloseable { input ->
                Files.copy(input, target.toPath(), StandardCopyOption.REPLACE_EXISTING)
            }
        }
    }
}

